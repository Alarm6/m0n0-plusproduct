<script>
(() => {
  const curtain=document.querySelector('.curtain'),mark=document.querySelector('.mark'),reel=document.querySelector('.reel'),win=document.querySelector('.window'),menu=document.querySelector('.menu'),panel=document.querySelector('.panel'),replay=document.querySelector('.replay'),skip=document.querySelector('.skip');
  const DURATION=3900,ROLL_END=1760,PAUSE_END=1950,SHRINK_END=2250,SHIFT_END=2850;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let start=0,raf=0,done=false,layout;
  function measure(){layout={w:innerWidth,h:innerHeight,logoW:mark.offsetWidth,slotH:win.clientHeight};}
  const clamp=x=>Math.min(1,Math.max(0,x)),lerp=(a,b,p)=>a+(b-a)*p;
  const easeOut=x=>1-Math.pow(1-x,3),smooth=x=>x*x*(3-2*x),glide=x=>(1-(1+8*x)*Math.exp(-8*x))/(1-9*Math.exp(-8));
  function closeMenu(){panel.hidden=true;menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Открыть меню брендов');}
  function render(t){
    if(!layout)measure();
    const {w,h,logoW,slotH}=layout,headerH=w<=600?56:64,logoH=logoW*60/329;
    const roll=clamp(t/ROLL_END),shrink=smooth(clamp((t-PAUSE_END)/(SHRINK_END-PAUSE_END)));
    const shift=glide(clamp((t-SHRINK_END)/(SHIFT_END-SHRINK_END)));
    const lift=glide(clamp((t-SHIFT_END)/(DURATION-SHIFT_END)));
    // A single continuous reel slows down to the last, original '+' glyph.
    const finalIndex=reel.children.length-1;
    if(t<=ROLL_END)window.productHaptics?.tick(Math.round(finalIndex*easeOut(roll)));
    reel.style.transform=`translate3d(0,${-finalIndex*slotH*easeOut(roll)}px,0)`;
    const finalScale=104/logoW;
    const actualScale=lerp(1,finalScale,shrink);
    const balance=lerp(logoW*.30,0,smooth(clamp((roll-.55)/.45)));
    // Three separate moves: shrink in place, slide left, then rise with the curtain.
    // Use the rendered left edge so changing the anchor cannot introduce a diagonal.
    const centeredLeft=w/2+balance-logoW*actualScale/2;

    mark.style.left=x+'px';mark.style.top=y+'px';
    mark.style.transform=`translateY(${-logoH*actualScale/2}px) scale(${actualScale})`;
    curtain.style.height=lerp(h,headerH,lift)+'px';curtain.style.background=`rgba(255,255,255,${lerp(1,.78,lift)})`;
    curtain.style.borderBottomColor=`rgba(255,255,255,${lift*.16})`;

  }
